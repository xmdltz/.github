name: YAML Lint

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kod
        uses: actions/checkout@v4

      - name: Installera yamllint
        run: pip install yamllint

      - name: Kör yamllint
        run: yamllint .github/workflows/*.yml .yamllint
